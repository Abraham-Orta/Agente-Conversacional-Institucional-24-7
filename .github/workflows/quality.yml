name: Calidad del software

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: ESLint y build de producción
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Compilar producción
        run: npm run build
        env:
          N8N_WEBHOOK_URL: https://example.invalid/webhook/chat
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
